<body>
    <header>
        <nav class="navbar">
            <div class="logo">Hafiz's Portfolio</div>
            <div class="nav-container">
                <!-- Theme Toggle Button -->
                <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle dark/light mode">🌙 Dark</button>
                <!-- Hambuerger Button (Mobile) -->
                <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation menu">

                <li><a href="index.html">Home</a></li>

                <li><a href="comments.html" class="active">Comments</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="comments-section">
            <h1>Leave A Comment</h1>
            <p>Feel free to leave your thoughts and feedback below!</p>

            <form action="#" method="post" class="comment-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="rating">Rating:</label>
                    <select id="rating" name="rating" required>
                        <option value="">Select a rating</option>
                        <option value="1">1 - Poor</option>
                        <option value="2">2 - Fair</option>
                        <option value="3">3 - Good</option>
                        <option value="4">4 - Very Good</option>
                        <option value="5">5 - Excellent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="comment">Comment:</label>
                    <textarea id="comment" name="comment" rows="5" required></textarea>
                </div>
                <button type="submit">Submit Comment</button>
            </form>
        </section>
    </main>
